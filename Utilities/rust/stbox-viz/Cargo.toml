[package]
name = "stbox-viz"
version = "0.1.0"
edition = "2024"
description = "SensorTile.box-Pro pumpfoil session visualiser — replaces Utilities/scripts/*.py"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
